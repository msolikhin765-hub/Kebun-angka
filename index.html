<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Game edukasi matematika Kelas 1 SD. Coba Bab 1 gratis: berhitung sambil bertualang bersama Bibi si lebah.">
<meta property="og:title" content="Kebun Angka – Coba Gratis Bab 1">
<meta property="og:description" content="Game matematika Kelas 1 SD dengan soal bergambar, raport, dan peringkat kelas. Main Bab 1 gratis sekarang!">
<meta property="og:type" content="website">
<meta name="theme-color" content="#8fd8ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='55' rx='38' ry='34' fill='%23ffd23f' stroke='%233a2a1f' stroke-width='5'/%3E%3Cpath d='M70 25v60M84 32v46' stroke='%235a3b22' stroke-width='9'/%3E%3Ccircle cx='38' cy='50' r='6' fill='%233a2a1f'/%3E%3Ccircle cx='58' cy='50' r='6' fill='%233a2a1f'/%3E%3Cpath d='M38 66q10 9 20 0' stroke='%233a2a1f' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Kebun Angka – Demo Gratis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a2a1f; --ink2:#6b5546;
  --sky1:#8fd8ff; --sky2:#d9f4ff;
  --grass:#6fcf5a; --grass2:#4fae3d;
  --sun:#ffd23f; --coral:#ff6f61; --orange:#ff9f2e; --purple:#9b7bff; --blue:#3fa9f5; --pink:#ff7eb6; --green:#43c463;
  --card:#fffdf7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,#eafbe4 100%);min-height:100dvh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid #fff;outline-offset:3px;box-shadow:0 0 0 7px var(--blue)}

/* scenery */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;opacity:.95;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.sun{position:absolute;top:18px;right:18px;width:92px;height:92px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:28vh;min-height:150px}

#app{position:relative;z-index:1;max-width:620px;margin:0 auto;min-height:100dvh;padding:14px 14px 40px;display:flex;flex-direction:column}
.screen{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}

/* chunky buttons */
.btn{--c:var(--orange);--d:#d97a10;background:var(--c);color:#fff;font-weight:700;font-size:1.35rem;padding:14px 26px;border-radius:22px;box-shadow:0 6px 0 var(--d),0 10px 18px rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.btn.green{--c:var(--green);--d:#2c9a49}
.btn.blue{--c:var(--blue);--d:#1f7fc4}
.btn.purple{--c:var(--purple);--d:#6e4fe0}
.btn.pink{--c:var(--pink);--d:#e0558f}
.btn.orange{--c:var(--orange);--d:#d97a10}
.btn.white{--c:#fff;--d:#d9cdbf;color:var(--ink);text-shadow:none}
.btn.big{font-size:1.8rem;padding:18px 40px;border-radius:28px}
.icon-btn{width:56px;height:56px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #d9cdbf;display:grid;place-items:center;transition:transform .08s}
.icon-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9cdbf}
.icon-btn svg{width:30px;height:30px}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .grow{flex:1}
.pill{background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 4px 0 #d9cdbf;display:inline-flex;align-items:center;gap:6px;font-size:1.1rem}
.pill svg{width:24px;height:24px}

/* home */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding-bottom:18vh}
.title{font-size:clamp(3rem,13vw,5rem);font-weight:700;line-height:.95;margin:0;letter-spacing:1px}
.title span{display:inline-block;animation:bounce 2.2s ease-in-out infinite;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.subtitle{background:#fff;border-radius:999px;padding:8px 20px;font-weight:600;font-size:1.15rem;box-shadow:0 4px 0 #d9cdbf}
.home .bibi-wrap{width:170px;height:170px}
.home-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* bibi */
.bibi{width:100%;height:100%;overflow:visible}
.bibi .wing{transform-origin:60px 40px;animation:flap .18s ease-in-out infinite alternate}
.bibi .wing.r{animation-delay:.09s}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.7)}}
.bibi-float{animation:float 2.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.bibi-jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{0%{transform:scale(1)}30%{transform:translateY(-26px) scale(1.12) rotate(-8deg)}60%{transform:translateY(0) scale(.95)}100%{transform:none}}
.bibi-shake{animation:wobble .5s}
@keyframes wobble{0%,100%{transform:none}20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}

/* map */
.map-head{text-align:center;margin:4px 0 8px}
.map-head h2{margin:0;font-size:2rem;-webkit-text-stroke:2px #fff;paint-order:stroke fill}
.map{position:relative;width:100%;margin:16px auto 0}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;padding:0}
.node .disc{width:96px;height:96px;border-radius:50%;background:var(--nc,#fff);border:6px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.18),0 12px 22px rgba(0,0,0,.12);display:grid;place-items:center;position:relative;transition:transform .1s}
.node:active .disc{transform:scale(.93)}
.node .disc svg{width:66px;height:66px}
.node .num{position:absolute;top:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:grid;place-items:center;border:3px solid #fff;font-size:1.05rem}
.node .label{background:#fff;border-radius:14px;padding:4px 12px;font-weight:700;font-size:1rem;box-shadow:0 3px 0 #d9cdbf;white-space:nowrap}
.node .stars{display:flex;gap:2px;margin-top:-2px}
.node .stars svg{width:22px;height:22px}
.node.locked .disc{background:#cfd6dc;filter:saturate(0)}
.node.locked .disc>svg{opacity:.35}
.node.locked .lock{position:absolute;width:42px;height:42px}
.node.current .disc{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 7px 0 rgba(0,0,0,.18),0 0 0 0 rgba(255,210,63,.9)}50%{box-shadow:0 7px 0 rgba(0,0,0,.18),0 0 0 14px rgba(255,210,63,0)}}
.map-bibi{position:absolute;width:64px;height:64px;transform:translate(36px,-105%);pointer-events:none;z-index:2}

/* card / intro */
.card{background:var(--card);border-radius:30px;padding:20px;box-shadow:0 8px 0 rgba(58,42,31,.12),0 16px 30px rgba(0,0,0,.08);border:4px solid #fff}
.intro{display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center;margin-top:6px}
.intro .badge{width:140px;height:140px;border-radius:50%;background:var(--nc);display:grid;place-items:center;border:8px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.intro .badge svg{width:96px;height:96px}
.intro h2{margin:0;font-size:2.1rem}
.speech{display:flex;align-items:flex-end;gap:8px;width:100%}
.speech .bibi-wrap{width:96px;height:96px;flex:none}
.bubble{position:relative;background:#fff;border-radius:24px;padding:14px 18px;font-size:1.25rem;font-weight:500;line-height:1.4;text-align:left;box-shadow:0 5px 0 #e6dccf;flex:1}
.bubble:before{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:16px solid #fff}
.say-btn{display:inline-flex;vertical-align:middle;margin-left:6px;width:38px;height:38px;border-radius:12px;background:var(--sky2);place-items:center}
.say-btn svg{width:22px;height:22px}

/* play */
.progress{display:flex;gap:6px;flex:1;justify-content:center}
.progress .seed{width:38px;height:38px}
.qcard{display:flex;flex-direction:column;gap:12px}
.qtext{font-size:1.5rem;font-weight:600;text-align:center;line-height:1.3}
.visual{background:linear-gradient(#f2fbff,#e6f7e3);border-radius:22px;padding:10px;min-height:170px;display:grid;place-items:center;border:3px dashed #cfe6cf}
.visual svg{width:100%;max-height:270px;display:block}
.btn svg{width:28px;height:28px;flex:none}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:4px}
.choices.two,.choices.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{--c:#fff;--d:#d9cdbf;background:var(--c);border-radius:24px;min-height:92px;font-size:2.4rem;font-weight:700;box-shadow:0 7px 0 var(--d);transition:transform .08s,box-shadow .08s,background .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;color:var(--ink);gap:2px}
.choice:active{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.choice.c0{--c:#ffe9a8;--d:#e8c04f}.choice.c1{--c:#c9ecff;--d:#73bfe8}.choice.c2{--c:#ffd6e7;--d:#ee8db6}.choice.c3{--c:#d9f5c9;--d:#86cf68}
.choice.pic svg{width:100%;max-height:110px}
.choice.pic .cap{font-size:1.05rem;font-weight:700}
.choice.word{font-size:1.35rem;line-height:1.1}
.choices.stack{grid-template-columns:1fr}
.choices.stack .choice{min-height:66px}
.choice.pic{padding:6px}
.choice.right{--c:var(--green)!important;--d:#2c9a49!important;color:#fff;animation:yay .5s}
.choice.wrong{--c:#eee!important;--d:#ccc!important;color:#aaa;animation:nope .4s;pointer-events:none}
.choice.wrong svg{opacity:.35}
@keyframes yay{40%{transform:scale(1.12)}}
@keyframes nope{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.helper{display:flex;align-items:center;gap:8px;min-height:74px}
.helper .bibi-wrap{width:74px;height:74px;flex:none}
.helper .bubble{font-size:1.1rem;padding:10px 14px}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:10px}
.result h2{font-size:2.3rem;margin:0}
.bigstars{display:flex;gap:6px;justify-content:center}
.bigstars svg{width:84px;height:84px;opacity:0;transform:scale(0) rotate(-90deg)}
.bigstars svg.show{animation:starIn .6s cubic-bezier(.3,1.7,.5,1) forwards}
.bigstars svg:nth-child(2){margin-top:-22px}
@keyframes starIn{to{opacity:1;transform:none}}
.sticker{width:150px;height:150px;border-radius:50%;background:var(--nc);border:8px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.15);display:grid;place-items:center;animation:stickerIn .9s .9s cubic-bezier(.3,1.6,.5,1) both;position:relative;overflow:hidden}
.sticker svg{width:100px;height:100px}
.sticker:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);animation:shine 2.4s 1.8s infinite}
@keyframes stickerIn{from{transform:scale(0) rotate(200deg)}to{transform:none}}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.btn-col{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}

/* album */
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px;margin-top:8px}
.slot{background:var(--card);border-radius:24px;padding:14px 8px;text-align:center;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.slot .sticker{width:96px;height:96px;margin:0 auto 6px;animation:none;border-width:5px}
.slot .sticker svg{width:64px;height:64px}
.slot.off .sticker{background:#e3e3e3}
.slot.off .sticker svg{filter:brightness(0);opacity:.15}
.slot b{display:block;font-size:1rem}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(40,30,20,.45);z-index:20;display:grid;place-items:center;padding:16px;overflow-y:auto;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{max-width:420px;width:100%;margin:auto 0}
.modal h3{margin:0 0 12px;font-size:1.6rem;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:2px dashed #eadfce;font-size:1.15rem;font-weight:500}
.toggle{width:64px;height:36px;border-radius:999px;background:#d8d0c6;position:relative;transition:background .2s;flex:none}
.toggle:after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on:after{left:32px}
.gate{font-size:1rem;color:var(--ink2);text-align:center;margin:8px 0}

/* kids */
.kid{width:100%;height:100%;overflow:visible;display:block}
.kid .leg,.kid .arm,.kid .bodyg{transform-box:view-box}
.kid .leg.l{transform-origin:34px 86px}.kid .leg.r{transform-origin:46px 86px}
.kid .arm.l{transform-origin:26px 58px}.kid .arm.r{transform-origin:54px 58px}
.kid.walk .leg.l,.kid.walk .arm.r{animation:swA .3s ease-in-out infinite alternate}
.kid.walk .leg.r,.kid.walk .arm.l{animation:swB .3s ease-in-out infinite alternate}
.kid.walk .bodyg{animation:bob .15s ease-in-out infinite alternate}
@keyframes swA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes swB{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes bob{to{transform:translateY(-2.5px)}}
.kid.wave .arm.r{animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-135deg)}to{transform:rotate(-175deg)}}
.kid.hop{animation:hop .8s ease-in-out infinite}
.kid.hop .arm.l{transform:rotate(145deg)}.kid.hop .arm.r{transform:rotate(-145deg)}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.kid.idle{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.97) translateY(1px)}}
.map-kid{position:absolute;width:58px;height:87px;transform:translate(calc(-100% - 44px),-62%);z-index:3;pointer-events:none}
.map-kid .flip{width:100%;height:100%;transition:transform .2s}
.map-kid .tag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.deco-kid{position:absolute;width:52px;height:78px;pointer-events:none;z-index:1}
.flag{position:absolute;width:90px;height:110px;transform:translate(-50%,-85%);pointer-events:none}
.flag .cloth{transform-box:view-box;transform-origin:20px 20px;animation:flutter 1s ease-in-out infinite alternate}
@keyframes flutter{to{transform:skewY(6deg) scaleX(.93)}}
.bfly{position:absolute;width:34px;height:34px;pointer-events:none;z-index:4;animation:fly 16s ease-in-out infinite}
.bfly .w{transform-box:view-box;transform-origin:20px 20px;animation:bw .2s ease-in-out infinite alternate}
@keyframes bw{to{transform:scaleX(.35)}}
@keyframes fly{0%{left:8%;top:12%}20%{left:78%;top:22%}40%{left:60%;top:48%}60%{left:12%;top:58%}80%{left:70%;top:80%}100%{left:8%;top:12%}}
.home-cast{display:flex;align-items:flex-end;justify-content:center;gap:4px}
.home-cast .k{width:76px;height:114px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.pick button{background:var(--card);border-radius:28px;border:5px solid #fff;box-shadow:0 7px 0 rgba(0,0,0,.12);padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:1.35rem;font-weight:700;transition:transform .1s}
.pick button:active{transform:translateY(5px)}
.pick .k{width:96px;height:144px}
.pick button.sel{border-color:var(--green);background:#eafbe4}
/* profiles, raport, ranking */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.pcard{background:var(--card);border-radius:24px;border:4px solid #fff;box-shadow:0 6px 0 rgba(0,0,0,.1);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.15rem}
.pcard .k{width:60px;height:90px}
.pcard small{font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:3px;font-size:.95rem}
.pcard small svg{width:18px;height:18px}
.pcard.add{border:4px dashed #c9b9a5;background:rgba(255,255,255,.6);justify-content:center;color:var(--ink2)}
.pcard.add b{font-size:2.6rem;line-height:1}
.field{font:inherit;font-size:1.4rem;width:100%;padding:12px 16px;border-radius:18px;border:4px solid #e2d6c6;text-align:center;font-weight:600;color:var(--ink);background:#fff}
.field:focus{outline:none;border-color:var(--blue)}
.raport{background:#fffef9;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 rgba(58,42,31,.12)}
.raport .head{background:linear-gradient(135deg,#43c463,#2c9a49);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:12px}
.raport .head .k{width:62px;height:93px;background:#fff;border-radius:18px;padding:4px;flex:none}
.raport .head h2{margin:0;font-size:1.6rem;line-height:1.1}
.raport .head div{font-weight:500}
.raport .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px}
.raport .sum div{background:#f4efe6;border-radius:16px;padding:10px 6px;text-align:center;font-weight:600;font-size:.9rem;color:var(--ink2)}
.raport .sum b{display:block;font-size:1.7rem;color:var(--ink)}
.rtab{width:100%;border-collapse:collapse;font-size:1rem}
.rtab td{padding:10px 8px;border-top:2px dashed #eadfce;vertical-align:middle}
.rtab td:first-child{padding-left:16px}.rtab td:last-child{padding-right:16px;text-align:right}
.rtab .ic{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;margin-right:8px;vertical-align:middle}
.rtab .ic svg{width:26px;height:26px}
.rtab .st{white-space:nowrap;padding:10px 2px}.rtab .st svg{width:15px;height:15px}
.rtab td:last-child{white-space:nowrap}
.grade{display:inline-block;min-width:40px;padding:3px 8px;border-radius:10px;font-weight:700;text-align:center;color:#fff}
.gA{background:#2c9a49}.gB{background:#3fa9f5}.gC{background:#ff9f2e}.gD{background:#ff6f61}.g0{background:#c9c1b6}
.note{margin:0 14px 14px;background:#fff6d6;border-radius:16px;padding:12px 14px;font-size:1.02rem;line-height:1.45}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 14px}
.podium .pl{display:flex;flex-direction:column;align-items:center;width:31%}
.podium .k{width:58px;height:87px}
.podium .nm{font-weight:700;font-size:1rem;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .bar{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.8rem;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.podium .p1 .bar{height:110px;background:linear-gradient(#ffd23f,#f0a800)}
.podium .p2 .bar{height:80px;background:linear-gradient(#cfd8e3,#9aa8b8)}
.podium .p3 .bar{height:62px;background:linear-gradient(#f2b27a,#c97a3d)}
.podium .sc{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:2px}.podium .sc svg{width:16px;height:16px}
.rank{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 12px;margin-bottom:8px;box-shadow:0 4px 0 #e6dccf;width:100%;text-align:left;font-size:1.05rem}

function confetti(n,y){if(RM)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;const cols=['#ff6f61','#ffd23f','#43c463','#3fa9f5','#9b7bff','#ff7eb6','#ff9f2e'];for(let i=0;i<n;i++)parts.push({x:innerWidth/2+R(-60,60),y:(y||innerHeight*.45),vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,s:R(6,12),c:pick(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0,shape:R(0,2)});if(!raf)loop()}
function loop(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life<140&&p.y<innerHeight+30);parts.forEach(p=>{p.life++;p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;if(p.shape===0)cx.fillRect(-p.s/2,-p.s/3,p.s,p.s/1.6);else if(p.shape===1){cx.beginPath();cx.arc(0,0,p.s/2.2,0,7);cx.fill()}else{starPath(cx,p.s*.7);cx.fill()}cx.restore()});if(parts.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}}

 star:(on)=>`<svg viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.4 7 .9-5.1 4.9 1.3 7-6.3-3.4-6.3 3.4 1.3-7L1.9 9.1l7-.9z" fill="${on?'#ffd23f':'#e3dccf'}" stroke="${on?'#e6a100':'#cfc5b6'}" stroke-width="1.6" stroke-linejoin="round"/>${on?'<path d="M8 8.6l2-.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>':''}</svg>`,

 on('[data-home]',home);on('[data-rap]',()=>raport(S.cur,map));

function play(id){
 const c=CH[id-1],qs=build(c);let i=0,miss=0,firstTry=0,tries=0;
 function show(){
  const q=qs[i];tries=0;
  const n=q.choices.length,isPic=q.choices.some(x=>x.pic),isWord=q.choices.some(x=>x.word);
  const cls=n===2?'two':(n===4?'four':(isWord&&q.choices.some(x=>x.label.length>7)?'stack':''));
  const ch=q.choices.map((x,k)=>`<button class="choice c${k%4} ${isPic?'pic':''} ${isWord?'word':''}" data-v="${x.value}" aria-label="${x.label||x.value}">${x.pic?x.pic:''}${x.pic?(x.label?`<span class="cap">${x.label}</span>`:''):x.label}</button>`).join('');
  render(`<div class="topbar"><button class="icon-btn" data-map aria-label="Keluar ke peta">${I.map}</button><div class="progress">${qs.map((_,k)=>seed(k<i)).join('')}</div><button class="icon-btn" data-say aria-label="Dengarkan soal">${I.sound}</button></div>
  <div class="card qcard"><div class="qtext">${q.text}</div>${q.visual?`<div class="visual">${q.visual}</div>`:''}
  <div class="choices ${isPic&&n===3?'':cls}" style="${isPic&&n===3?'grid-template-columns:repeat(3,1fr)':''}">${ch}</div></div>
  <div class="helper"><div class="bibi-wrap bibi-float" id="hb">${bibi()}</div><div class="bubble" id="hm">Soal ${i+1} dari 5. Kamu pasti bisa!</div></div>`);
  on('[data-map]',map);on('[data-say]',()=>say(q.text));
  if(S.voice)setTimeout(()=>say(q.text),250);
  app.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{
   const v=b.dataset.v,ok=String(q.answer)===v;const hb=document.getElementById('hb'),hm=document.getElementById('hm');
   if(ok){sfx.ok();b.classList.add('right');app.querySelectorAll('.choice').forEach(x=>x.style.pointerEvents='none');if(tries===0)firstTry++;
    const p=pick(praise);hb.innerHTML=bibi('happy');hb.className='bibi-wrap bibi-jump';hm.textContent=p;say(p);
    const r=b.getBoundingClientRect();confetti(36,r.top+r.height/2);
    setTimeout(()=>{i++;if(i<qs.length)show();else result(id,firstTry)},1400);
   }else{sfx.no();tries++;miss++;b.classList.add('wrong');hb.innerHTML=bibi('oops');hb.className='bibi-wrap bibi-shake';const m=tries>1?q.hint:pick(nudges);hm.textContent=m;say(m)}
  }));
 }

}
function result(id,good){
 const st=good>=5?3:good>=3?2:1;const prev=S.stars[id]||0;const isNew=prev===0;S.stars[id]=Math.max(prev,st);{const P0=P();P0.scores=P0.scores||{};const r=P0.scores[id]||{best:0,plays:0,sum:0};r.best=Math.max(r.best,good);r.plays++;r.sum+=good;r.last=good;r.date=Date.now();P0.scores[id]=r}save();
 const c=CH[id-1],next=CH[id];
 const msg=st===3?'Sempurna!':st===2?'Bagus sekali!':'Kamu berhasil!';
 render(topbar(`<button class="icon-btn" data-map aria-label="Peta">${I.map}</button>`)+`<div class="card result" style="--nc:${c.col}">
 <h2>${msg}</h2><div class="bigstars">${[1,2,3].map(k=>I.star(k<=st)).join('')}</div>
 <div style="font-size:1.2rem;font-weight:500">Benar di percobaan pertama: <b>${good} dari 5</b></div>
 <div style="display:flex;align-items:flex-end;gap:12px"><div style="width:72px;height:108px">${kid(S.avatar||'putra','hop')}</div><div class="sticker" aria-label="Stiker ${c.name}">${c.icon()}</div><div style="width:72px;height:108px">${kid(other(S.avatar||'putra'),'wave')}</div></div>
 <div style="font-weight:600">${isNew?'Stiker baru masuk album!':'Stiker '+c.name+' sudah ada di album.'}</div>
 <div class="btn-col">${next?`<button class="btn green" data-next>${I.lock.replace('class="lock"','style="width:26px;height:26px"')} Buka 6 bab lainnya ➜</button>`:`<button class="btn purple" data-album>${I.book} Lihat Album</button>`}
 <button class="btn white" data-again>Main lagi</button><button class="btn purple" data-rap>${I.trophy} Lihat Raport</button><button class="btn blue" data-map2>${I.map.replace('#3a2a1f','#fff')} Peta Kebun</button></div></div>`);
 sfx.win();say(msg);
 const ss=app.querySelectorAll('.bigstars svg');ss.forEach((s,k)=>setTimeout(()=>{s.classList.add('show');if(k<st)sfx.pop()},300+k*350));
 setTimeout(()=>confetti(120,innerHeight*.35),500);
 on('[data-map]',map);on('[data-map2]',map);on('[data-rap]',()=>raport(S.cur,map));on('[data-again]',()=>play(id));on('[data-next]',()=>showBuy(id+1));on('[data-album]',album);
}
function album(){
 const got=CH.filter(c=>S.stars[c.id]>0).length;
 render(topbar(`<button class="icon-btn" data-home aria-label="Beranda">${I.home}</button>`,`<div style="text-align:center;font-weight:700;font-size:1.4rem">Album Stiker</div>`)+`<div class="card"><div style="text-align:center;font-size:1.15rem;font-weight:500">Kamu sudah punya <b>${got} dari ${CH.length}</b> stiker</div>
 <div class="album">${CH.map(c=>{const has=S.stars[c.id]>0;return `<div class="slot ${has?'':'off'}"><div class="sticker" style="--nc:${c.col}">${c.icon()}</div><b>${has?c.name:'???'}</b><div class="stars" style="display:flex;justify-content:center">${has?[1,2,3].map(k=>`<span style="width:20px;display:inline-block">${I.star(k<=S.stars[c.id])}</span>`).join(''):''}</div></div>`}).join('')}</div></div>
 <div style="text-align:center;margin-top:16px"><button class="btn green" data-go>${I.map.replace('#3a2a1f','#fff')} Ke Peta</button></div>`);
 on('[data-home]',home);on('[data-go]',map);
}
function settings(){
 const a=R(3,9),b=R(3,9);
 const bg=document.createElement('div');bg.className='modal-bg';
 bg.innerHTML=`<div class="card modal" role="dialog" aria-label="Pengaturan"><h3>Pengaturan</h3>
 <div class="row">Suara efek<button class="toggle ${S.sound?'on':''}" data-k="sound" aria-label="Suara efek"></button></div>
 <div class="row">Bacakan soal<button class="toggle ${S.voice?'on':''}" data-k="voice" aria-label="Bacakan soal"></button></div>
 <div class="row">Tokoh pemain<button class="btn white" data-av2 style="font-size:1rem;padding:8px 14px">${S.avatar==='putri'?'Putri':'Putra'} ⇄</button></div>
 <div class="row">Suara Bibi<button class="btn blue" data-tv style="font-size:1rem;padding:8px 14px">Dengar</button></div>
 <div class="gate" id="vinfo" style="text-align:left;font-size:.92rem">${VOICE?'Suara yang dipakai: <b>'+VOICE.name+'</b>':'HP ini belum punya suara Bahasa Indonesia, jadi suaranya kurang jelas. Pasang lewat Pengaturan HP → Text-to-speech → Google → unduh <b>Bahasa Indonesia</b>.'}</div>
 <div id="grown"><div class="gate">Khusus orang tua/guru: berapa ${a} × ${b}?</div><div style="display:flex;gap:8px;justify-content:center"><input id="gate" inputmode="numeric" style="font:inherit;font-size:1.3rem;width:110px;padding:8px 12px;border-radius:14px;border:3px solid #e2d6c6;text-align:center"><button class="btn blue" id="gateok" style="font-size:1.1rem;padding:10px 18px">OK</button></div></div>
 <div style="text-align:center;margin-top:16px"><button class="btn green" data-close>Selesai</button></div></div>`;
 document.body.appendChild(bg);
 bg.querySelector('[data-av2]').onclick=e=>{S.avatar=other(S.avatar||'putra');save();e.target.textContent=(S.avatar==='putri'?'Putri':'Putra')+' ⇄';sfx.tap()};
 bg.querySelector('[data-tv]').onclick=()=>{const v=S.voice;S.voice=true;say('Halo teman! Aku Bibi. Ayo kita berhitung bersama!');S.voice=v};
 bg.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>{S[t.dataset.k]=!S[t.dataset.k];t.classList.toggle('on',S[t.dataset.k]);save();sfx.tap()});
 bg.querySelector('#gateok').onclick=()=>{if(+bg.querySelector('#gate').value===a*b){bg.querySelector('#grown').innerHTML=`<div class="row">Nama kelas<input class="field" id="cn" value="${esc(S.className)}" maxlength="20" style="font-size:1.05rem;padding:6px 10px;width:150px"></div>${S.profiles.map(p=>`<div class="row">${esc(p.name)}<button class="btn pink" data-del="${p.id}" style="font-size:.95rem;padding:6px 12px">Hapus anak</button></div>`).join('')}<div class="row" style="flex-wrap:wrap">Semua anak<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn orange" id="ra" style="font-size:.95rem;padding:8px 12px">Ulang progres</button><button class="btn pink" id="da" style="font-size:.95rem;padding:8px 12px">Hapus semua</button></span></div>
 <div class="gate" style="text-align:left;font-size:.88rem;margin-top:-4px">"Ulang progres" mengosongkan bintang &amp; nilai tapi nama tetap ada. "Hapus semua" menghapus semua nama anak beserta progresnya.</div><div class="row" style="display:none">Buka semua bab<button class="toggle ${S.unlockAll?'on':''}" id="ua" aria-label="Buka semua bab"></button></div><div class="row">Hapus progres anak ini<button class="btn pink" id="rs" style="font-size:1rem;padding:8px 14px">Hapus</button></div>`;
  bg.querySelector('#cn').onchange=e=>{S.className=e.target.value.trim()||'Kelas 1';save()};
  bg.querySelectorAll('[data-del]').forEach(d=>d.onclick=()=>{if(d.dataset.sure){S.profiles=S.profiles.filter(p=>p.id!==d.dataset.del);if(S.cur===d.dataset.del)S.cur=null;save();d.closest('.row').remove()}else{d.dataset.sure=1;d.textContent='Yakin? Tekan lagi'}});
  const twice=(el,txt,fn)=>el.onclick=()=>{if(el.dataset.sure){fn();el.textContent='Selesai ✓';el.disabled=true;sfx.ok()}else{el.dataset.sure=1;el.textContent=txt;sfx.no()}};
  twice(bg.querySelector('#ra'),'Yakin? Tekan lagi',()=>{S.profiles.forEach(p=>{p.stars={};p.scores={};p.walk=null});save()});
  twice(bg.querySelector('#da'),'Yakin? Tekan lagi',()=>{S.profiles=[];S.cur=null;save();bg.querySelectorAll('[data-del]').forEach(d=>d.closest('.row').remove())});
  bg.querySelector('#ua').onclick=e=>{S.unlockAll=!S.unlockAll;e.target.classList.toggle('on',S.unlockAll);save()};
  bg.querySelector('#rs').onclick=e=>{if(e.target.dataset.sure){if(P()!==DUMMY){P().stars={};P().scores={}}save();e.target.textContent='Terhapus';e.target.disabled=true}else{e.target.dataset.sure=1;e.target.textContent='Yakin? Tekan lagi'}};
 }else{bg.querySelector('#gate').animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:300})}};
 const close=()=>{bg.remove();if(document.querySelector('.home'))home();else if(document.querySelector('[data-rset]'))ranking()};
 bg.querySelector('[data-close]').onclick=close;bg.onclick=e=>{if(e.target===bg)close()};
}
try{speechSynthesis&&speechSynthesis.getVoices()}catch(e){}
home();
window.__KA={CH,build,play,result,map,album,intro};
})();
</script>
